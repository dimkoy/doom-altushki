const MW = LEVELS[0].map[0].length, MH = LEVELS[0].map.length;
for (const L of LEVELS)
  for (const r of L.map)
    if (r.length !== MW) console.warn('кривая строка карты:', L.name, r);

let MAP = LEVELS[0].map;
let FREE = [];
function computeFree() {
  FREE = [];
  for (let y = 0; y < MH; y++)
    for (let x = 0; x < MW; x++)
      if (MAP[y][x] === '.') FREE.push([x + 0.5, y + 0.5]);
}
computeFree();

// глифы карты: 1/2/3 — стены; ~ — вода; = / ^ — приподнятые платформы; . — пол
const PLATH = { '=': 0.42, '^': 0.72 };
const isWall = ch => ch === '1' || ch === '2' || ch === '3';
const cellAt = (x, y) => {
  const xi = Math.floor(x), yi = Math.floor(y);
  if (xi < 0 || yi < 0 || xi >= MW || yi >= MH) return '1';
  return MAP[yi][xi];
};
const solidAt = (x, y) => isWall(cellAt(x, y));
const floorHAt = (x, y) => { const c = cellAt(x, y); return isWall(c) ? 1 : (PLATH[c] || 0); };
const isWaterAt = (x, y) => cellAt(x, y) === '~';
const blocked = (x, y, r) =>
  solidAt(x - r, y - r) || solidAt(x + r, y - r) ||
  solidAt(x - r, y + r) || solidAt(x + r, y + r);

// ===================== помощники рисования =====================
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function heartPath(g, x, y, s) {
  g.beginPath();
  g.moveTo(x, y + 0.5 * s);
  g.bezierCurveTo(x + 0.55 * s, y + 0.12 * s, x + 0.6 * s, y - 0.42 * s, x, y - 0.16 * s);
  g.bezierCurveTo(x - 0.6 * s, y - 0.42 * s, x - 0.55 * s, y + 0.12 * s, x, y + 0.5 * s);
  g.closePath();
}

// ===================== текстуры стен =====================
function makeTex(kind) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  if (kind === 1) { // кирпич
    g.fillStyle = '#4e2129'; g.fillRect(0, 0, 64, 64);
    g.fillStyle = '#5c2a32';
    for (let row = 0; row < 4; row++)
      for (let i = -1; i < 3; i++)
        g.fillRect(i * 24 + (row % 2 ? 12 : 0) + 1, row * 16 + 1, 22, 14);
    g.strokeStyle = '#2b1116'; g.lineWidth = 2;
    for (let row = 0; row <= 4; row++) {
      g.beginPath(); g.moveTo(0, row * 16); g.lineTo(64, row * 16); g.stroke();
    }
  } else if (kind === 2) { // камень с граффити
    g.fillStyle = '#3a3247'; g.fillRect(0, 0, 64, 64);
    g.strokeStyle = '#241f30'; g.lineWidth = 2;
    for (let i = 0; i <= 4; i++) {
      g.beginPath(); g.moveTo(0, i * 16); g.lineTo(64, i * 16); g.stroke();
      g.beginPath(); g.moveTo(i * 16 + (i % 2 ? 8 : 0), 0); g.lineTo(i * 16 + (i % 2 ? 8 : 0), 64); g.stroke();
    }
    heartPath(g, 32, 30, 26);
    g.fillStyle = 'rgba(255,79,168,0.75)'; g.fill();
    g.fillStyle = 'rgba(255,79,168,0.5)'; g.fillRect(30, 42, 3, 14); // подтёк
  } else { // металл с неоном
    g.fillStyle = '#262a33'; g.fillRect(0, 0, 64, 64);
    g.fillStyle = '#1d2027';
    for (let i = 0; i < 4; i++) g.fillRect(i * 16 + 1, 0, 2, 64);
    g.fillStyle = '#3b4250';
    for (let i = 0; i < 4; i++) { g.fillRect(i * 16 + 6, 6, 3, 3); g.fillRect(i * 16 + 6, 55, 3, 3); }
    g.fillStyle = '#ff4fa8'; g.fillRect(0, 38, 64, 4);
    g.fillStyle = 'rgba(255,79,168,0.35)'; g.fillRect(0, 34, 64, 12);
  }
  // шум
  for (let i = 0; i < 90; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.14)' : 'rgba(255,255,255,0.05)';
    g.fillRect((Math.random() * 64) | 0, (Math.random() * 64) | 0, 2, 2);
  }
  return c;
}
const TEX = { '1': makeTex(1), '2': makeTex(2), '3': makeTex(3) };

// ===================== спрайты альтушек =====================
const GIRLS = [
  { hair: '#ff4fa8', accent: '#ffd1e8', style: 'long' },
  { hair: '#9d5cff', accent: '#e2cdff', style: 'buns' },
  { hair: '#34e0ac', accent: '#c5ffe9', style: 'bob' },
];

function eyeG(g, x, y, heart, dir) {
  if (heart) {
    heartPath(g, x, y + 1, 13);
    g.fillStyle = '#ff2f7e'; g.fill();
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.beginPath(); g.arc(x - 2, y - 2, 1.6, 0, TAU); g.fill();
    return;
  }
  g.fillStyle = '#fff';
  g.beginPath(); g.ellipse(x, y, 6.5, 5, 0, 0, TAU); g.fill();
  g.fillStyle = '#241a26';
  g.beginPath(); g.arc(x, y + 0.5, 3, 0, TAU); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(x - 1, y - 1, 1.1, 0, TAU); g.fill();
  // подводка со стрелкой
  g.strokeStyle = '#0c0a10'; g.lineWidth = 2.2;
  g.beginPath();
  g.moveTo(x - 7, y - 4); g.quadraticCurveTo(x, y - 7, x + 7, y - 4);
  g.moveTo(x + 7 * dir, y - 4); g.lineTo(x + 11 * dir, y - 7);
  g.stroke();
}

function makeGirl(vi, frame) { // frame: 0,1 — ходьба, 2 — атака
  const v = GIRLS[vi];
  const c = document.createElement('canvas');
  c.width = 96; c.height = 192;
  const g = c.getContext('2d');
  const cx = 48, skin = '#f4ddcf', cloth = '#16141c', tight = '#262130';
  const atk = frame === 2, sw = frame === 0 ? 1 : frame === 1 ? -1 : 0;

  // волосы СЗАДИ — рисуем первыми, чтобы тело и лицо были поверх
  g.fillStyle = v.hair;
  if (v.style === 'long') { rr(g, cx - 26, 18, 52, 90, 20); g.fill(); }
  else if (v.style === 'buns') {
    rr(g, cx - 24, 18, 48, 52, 18); g.fill();
    g.beginPath(); g.arc(cx - 24, 16, 13, 0, TAU); g.fill();
    g.beginPath(); g.arc(cx + 24, 16, 13, 0, TAU); g.fill();
  } else { rr(g, cx - 26, 16, 52, 56, 20); g.fill(); }
  g.fillStyle = 'rgba(0,0,0,0.18)';
  if (v.style === 'long') { g.fillRect(cx - 26, 62, 7, 44); g.fillRect(cx + 19, 62, 7, 44); }

  // ноги в колготках с сеткой
  g.fillStyle = tight;
  g.fillRect(cx - 15, 122, 13, 46);
  g.fillRect(cx + 2, 122, 13, 46);
  g.strokeStyle = 'rgba(255,255,255,0.09)'; g.lineWidth = 1;
  for (let yy = 126; yy < 164; yy += 7) {
    g.beginPath();
    g.moveTo(cx - 15, yy); g.lineTo(cx - 2, yy + 5);
    g.moveTo(cx + 15, yy); g.lineTo(cx + 2, yy + 5);
    g.stroke();
  }
  // ботинки на платформе
  g.fillStyle = '#0a090f';
  rr(g, cx - 18, 156, 17, 30, 3); g.fill();
  rr(g, cx + 1, 156, 17, 30, 3); g.fill();
  g.fillStyle = '#33303f';
  g.fillRect(cx - 18, 180, 17, 7); g.fillRect(cx + 1, 180, 17, 7);
  g.strokeStyle = v.hair; g.lineWidth = 1.5;
  g.beginPath();
  for (let yy = 160; yy < 176; yy += 5) {
    g.moveTo(cx - 15, yy); g.lineTo(cx - 5, yy + 3);
    g.moveTo(cx + 5, yy + 3); g.lineTo(cx + 15, yy);
  }
  g.stroke();
  // юбка
  g.fillStyle = cloth;
  g.beginPath();
  g.moveTo(cx - 19, 104); g.lineTo(cx + 19, 104);
  g.lineTo(cx + 27, 136); g.lineTo(cx - 27, 136);
  g.closePath(); g.fill();
  // ремень с клёпками
  g.fillStyle = '#0a090f'; g.fillRect(cx - 20, 101, 40, 7);
  g.fillStyle = '#cfd4e2';
  for (let i = -12; i <= 12; i += 8) g.fillRect(cx + i - 1, 103, 3, 3);
  // цепь на юбке
  g.strokeStyle = '#9aa2b5'; g.lineWidth = 2;
  g.beginPath(); g.arc(cx - 6, 114, 17, Math.PI * 0.18, Math.PI * 0.62); g.stroke();
  // руки при ходьбе
  if (!atk) {
    g.fillStyle = cloth;
    rr(g, cx - 29, 72 + sw * 4, 11, 36, 5); g.fill();
    rr(g, cx + 18, 72 - sw * 4, 11, 36, 5); g.fill();
    g.fillStyle = skin;
    g.beginPath(); g.arc(cx - 23, 112 + sw * 4, 6, 0, TAU); g.fill();
    g.beginPath(); g.arc(cx + 23, 112 - sw * 4, 6, 0, TAU); g.fill();
  }
  // кроп-топ с сердечком
  g.fillStyle = cloth; rr(g, cx - 18, 66, 36, 34, 7); g.fill();
  heartPath(g, cx, 84, 16); g.fillStyle = v.hair; g.fill();
  g.fillStyle = skin; g.fillRect(cx - 13, 98, 26, 5); // полоска живота
  // шея и чокер с шипами
  g.fillStyle = skin; g.fillRect(cx - 6, 52, 12, 16);
  g.fillStyle = '#0a090f'; g.fillRect(cx - 9, 58, 18, 7);
  g.fillStyle = '#e8ecf5';
  g.beginPath(); g.moveTo(cx - 5, 58); g.lineTo(cx - 2.5, 53); g.lineTo(cx, 58); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(cx + 1, 58); g.lineTo(cx + 3.5, 53); g.lineTo(cx + 6, 58); g.closePath(); g.fill();
  // голова
  g.fillStyle = skin;
  g.beginPath(); g.arc(cx, 40, 20, 0, TAU); g.fill();
  // румянец
  g.fillStyle = 'rgba(255,110,160,0.35)';
  g.beginPath(); g.arc(cx - 11, 47, 4.5, 0, TAU); g.fill();
  g.beginPath(); g.arc(cx + 11, 47, 4.5, 0, TAU); g.fill();
  // глаза
  eyeG(g, cx - 9, 42, atk, -1);
  eyeG(g, cx + 9, 42, atk, 1);
  // брови
  if (!atk) {
    g.strokeStyle = '#221c28'; g.lineWidth = 2;
    g.beginPath();
    g.moveTo(cx - 14, 34); g.lineTo(cx - 5, 36);
    g.moveTo(cx + 5, 36); g.lineTo(cx + 14, 34);
    g.stroke();
  }
  // рот (тёмная помада); при атаке — воздушный поцелуй
  if (atk) {
    g.fillStyle = '#6e1d3a';
    g.beginPath(); g.arc(cx, 52, 4.5, 0, TAU); g.fill();
    heartPath(g, cx + 13, 55, 9); g.fillStyle = '#ff4fa8'; g.fill();
  } else {
    g.fillStyle = '#6e1d3a';
    g.beginPath();
    g.moveTo(cx - 5, 52); g.quadraticCurveTo(cx, 55, cx + 6, 51);
    g.quadraticCurveTo(cx, 57, cx - 5, 52);
    g.fill();
  }
  // пирсинг: нос, бровь, серьги-кольца
  g.fillStyle = '#e8ecf5';
  g.beginPath(); g.arc(cx + 3, 47, 1.3, 0, TAU); g.fill();
  g.beginPath(); g.arc(cx - 12, 33, 1.3, 0, TAU); g.fill();
  g.strokeStyle = '#e8ecf5'; g.lineWidth = 1.5;
  g.beginPath(); g.arc(cx - 20, 48, 3, 0, TAU); g.stroke();
  g.beginPath(); g.arc(cx + 20, 48, 3, 0, TAU); g.stroke();
  // чёлка с зубчиками
  g.fillStyle = v.hair;
  g.beginPath();
  g.moveTo(cx - 21, 36);
  g.quadraticCurveTo(cx - 22, 16, cx, 16);
  g.quadraticCurveTo(cx + 22, 16, cx + 21, 36);
  g.lineTo(cx + 14, 28); g.lineTo(cx + 8, 36); g.lineTo(cx + 2, 27);
  g.lineTo(cx - 4, 36); g.lineTo(cx - 10, 27); g.lineTo(cx - 16, 35);
  g.closePath(); g.fill();
  // цветная прядь
  g.strokeStyle = v.accent; g.lineWidth = 3;
  g.beginPath(); g.moveTo(cx - 6, 17); g.quadraticCurveTo(cx - 12, 24, cx - 13, 33); g.stroke();
  // руки при атаке — тянутся к игроку
  if (atk) {
    g.fillStyle = cloth;
    rr(g, cx - 34, 70, 12, 26, 6); g.fill();
    rr(g, cx + 22, 70, 12, 26, 6); g.fill();
    g.fillStyle = skin;
    g.beginPath(); g.arc(cx - 28, 66, 8, 0, TAU); g.fill();
    g.beginPath(); g.arc(cx + 28, 66, 8, 0, TAU); g.fill();
  }
  return c;
}
const girlSprites = GIRLS.map((_, i) => [0, 1, 2].map(f => makeGirl(i, f)));

// толстушка-обнимашка: короткий розовый боб, пышные формы, в атаке — распахнутые объятия

  g.fillStyle = hair;

  g.fillStyle = tight;
  g.fillRect(cx - 22, 128, 19, 38);

  g.fillStyle = '#33303f';
  g.fillRect(cx - 26, 180, 23, 7); g.fillRect(cx + 3, 180, 23, 7);
  // руки: при ходьбе вдоль тела, при атаке — распахнуты для объятий
  if (!atk) {

    g.beginPath(); g.arc(cx - 39, 116 + sw * 4, 7, 0, TAU); g.fill();

  }
  // пышное тело: кроп-топ с сердцем и животик с пирсингом
  g.fillStyle = cloth;
  g.beginPath(); g.ellipse(cx, 92, 37, 30, 0, 0, TAU); g.fill();
  heartPath(g, cx, 90, 20); g.fillStyle = hair; g.fill();
  g.fillStyle = skin;
  g.beginPath(); g.ellipse(cx, 124, 30, 17, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.12)';
  g.beginPath(); g.arc(cx, 128, 3, 0, TAU); g.fill();
  g.fillStyle = '#e8ecf5';
  g.beginPath(); g.arc(cx, 122, 1.7, 0, TAU); g.fill();
  // шея и чокер с сердечком
  g.fillStyle = skin; g.fillRect(cx - 7, 52, 14, 14);
  g.fillStyle = '#0a090f'; g.fillRect(cx - 11, 57, 22, 7);
  heartPath(g, cx, 61, 6); g.fillStyle = hair; g.fill();
  // круглая голова и щёчки
  g.fillStyle = skin;
  g.beginPath(); g.ellipse(cx, 38, 23, 21, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,110,160,0.4)';
  g.beginPath(); g.arc(cx - 14, 46, 5.5, 0, TAU); g.fill();
  g.beginPath(); g.arc(cx + 14, 46, 5.5, 0, TAU); g.fill();
  eyeG(g, cx - 10, 40, atk, -1);
  eyeG(g, cx + 10, 40, atk, 1);
  // рот: в атаке — счастливое «О» обнимашек
  if (atk) {
    g.fillStyle = '#6e1d3a';
    g.beginPath(); g.ellipse(cx, 53, 5, 6, 0, 0, TAU); g.fill();
  } else {

// floor casting: рисует пол (фон-камень) и анимированную воду в нижней половине вида
function castFloor(camZ, dirX, dirY, plX, plY) {
  const data = floorBuf.data;
  const rdx0 = dirX - plX, rdy0 = dirY - plY;   // луч в левый край экрана
  const rdx1 = dirX + plX, rdy1 = dirY + plY;   // луч в правый край
  for (let sy = 0; sy < HALF; sy += 2) {
    const p = sy + 1;
    const rowDist = camZ * VIEW_H / p;
    const stepX = rowDist * (rdx1 - rdx0) / W * 2;
    const stepY = rowDist * (rdy1 - rdy0) / W * 2;
    let fx = player.x + rowDist * rdx0;
    let fy = player.y + rowDist * rdy0;
    const k = 1 - Math.min(0.82, rowDist / 14) * 0.92;
    const rowOff = sy * W * 4;
    for (let sx = 0; sx < W; sx += 2) {
      let r, gg, b;
      if (cellAt(fx, fy) === '~') {
        // вишнёвый блейзер: две волны интерферируют, блики — розоватая пенка
        const rip = 0.5 + 0.25 * Math.sin(gt * 2.4 + fx * 2.3 + fy * 2.0)
                        + 0.25 * Math.sin(gt * 1.6 - fx * 1.7 + fy * 2.9);
        const cau = Math.max(0, Math.sin(gt * 1.9 + fx * 4.0 - fy * 3.0)) ** 4;
        r = (70 + 85 * rip + 95 * cau) * k;
        gg = (6 + 18 * rip + 48 * cau) * k;
        b = (22 + 30 * rip + 55 * cau) * k;
      } else {
        r = 38 * k; gg = 28 * k; b = 40 * k;
      }
      const i0 = rowOff + sx * 4;
      const i1 = i0 + W * 4;
      data[i0] = data[i0 + 4] = data[i1] = data[i1 + 4] = r;
      data[i0 + 1] = data[i0 + 5] = data[i1 + 1] = data[i1 + 5] = gg;
      data[i0 + 2] = data[i0 + 6] = data[i1 + 2] = data[i1 + 6] = b;
      data[i0 + 3] = data[i0 + 7] = data[i1 + 3] = data[i1 + 7] = 255;
      fx += stepX; fy += stepY;
    }
  }
  ctx.putImageData(floorBuf, 0, HALF);
}

let AC = null;
function initAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { /* без звука */ }
}
function blip(type, f0, f1, dur, vol, delay = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* ок */ }
}

function sfxMoan(boss) {
  if (!AC) return;
  try {
    const t = AC.currentTime;
    const v = (Math.random() * 3) | 0;
    const k = boss ? 0.7 : 1;
    const vol = boss ? 0.2 : 0.14;
    const moan = (f0, t0, dur, vl, fEnd, vib = 5.5, type = 'triangle') => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, fEnd), t0 + dur);
      const lfo = AC.createOscillator(), lg = AC.createGain();
      lfo.frequency.value = vib; lg.gain.value = f0 * 0.05;
      lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.001, t0);
      g.gain.exponentialRampToValueAtTime(vl, t0 + 0.06);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t0); lfo.start(t0);
      o.stop(t0 + dur + 0.05); lfo.stop(t0 + dur + 0.05);
    };
    if (v === 0) {        // «а-ах…» — долгий спад
      const f = (430 + Math.random() * 80) * k;
      moan(f * 1.16, t, boss ? 0.95 : 0.6, vol, f * 0.45);
    } else if (v === 1) { // «м-м-м…» — низкое мычание с глубоким медленным вибрато
      const f = (300 + Math.random() * 60) * k;
      const d = boss ? 1.1 : 0.75;
      moan(f, t, d, vol * 0.9, f * 0.78, 4.2, 'sine');
      moan(f * 2, t, d * 0.7, vol * 0.35, f * 1.5, 4.2, 'sine');
    } else {              // «ох… ох…» — двойной всхлип
      const f = (480 + Math.random() * 70) * k;
      moan(f, t, 0.28, vol, f * 0.62);
      moan(f * 0.92, t + (boss ? 0.4 : 0.3), boss ? 0.6 : 0.38, vol * 0.9, f * 0.4);
    }
  } catch (e) { /* ок */ }
}

// крик готки: воющий стон-сирена — пара расстроенных осцилляторов с вибрато, нисходящий
function sfxScream() {
  if (!AC) return;
  try {
    const t = AC.currentTime;
    const f0 = 580 + Math.random() * 120;
    for (const det of [-7, 7]) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.42, t + 0.55);
      o.detune.value = det;
      const lfo = AC.createOscillator(), lg = AC.createGain();
      lfo.frequency.value = 7; lg.gain.value = f0 * 0.06;
      lfo.connect(lg); lg.connect(o.frequency);
      const fl = AC.createBiquadFilter();
      fl.type = 'lowpass'; fl.frequency.value = 2200; fl.Q.value = 2;
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.11, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      o.connect(fl); fl.connect(g); g.connect(AC.destination);
      o.start(t); lfo.start(t);
      o.stop(t + 0.6); lfo.stop(t + 0.6);
    }
  } catch (e) { /* ок */ }
}

// ===================== фоновая музыка: тихий готик-рок =====================
const mNote = m => 440 * Math.pow(2, (m - 69) / 12);
const M_STEP = 60 / 112 / 4;                     // 16-е ноты при 112 BPM
const M_BARS = [                                 // Em — C — D — Em (i–VI–VII)
  { bass: 40, pad: [52, 55, 59] },
  { bass: 36, pad: [48, 52, 55] },
  { bass: 38, pad: [50, 54, 57] },
  { bass: 40, pad: [52, 55, 59] },
];
// разреженная тоскливая мелодия: шаг → [нота, длительность в шагах]
const M_LEAD = {
  0: [71, 4], 6: [67, 2], 8: [69, 4], 14: [66, 2],
  16: [64, 6], 24: [67, 4], 28: [69, 4],
  32: [66, 4], 38: [69, 2], 40: [74, 6],
  48: [71, 10], 60: [67, 2], 62: [66, 2],
};
let musicGain = null, musicDelay = null, musicTimer = null, mStep = 0, mNextT = 0, noiseBuf = null;
// пара расстроенных осцилляторов через lowpass — теплее и живее голой волны
function mTone(t, f, dur, vol, o = {}) {
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + (o.att || 0.02));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = o.cut || 1100; lp.Q.value = 0.7;
  g.connect(lp); lp.connect(musicGain);
  if (o.echo) lp.connect(musicDelay);
  for (const det of (o.det ? [-o.det, o.det] : [0])) {
    const osc = AC.createOscillator();
    osc.type = o.type || 'sawtooth';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    osc.detune.value = det;
    osc.connect(g); osc.start(t); osc.stop(t + dur + 0.05);
  }
}
function mNoise(t, dur, vol, freq) {
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, (AC.sampleRate * 0.25) | 0, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf;
  f.type = freq > 4000 ? 'highpass' : 'bandpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(musicGain);
  s.start(t); s.stop(t + dur + 0.02);
}
function mSchedule(s, t) {
  const bar = (s >> 4) & 3, st = s & 15, B = M_BARS[bar];
  // качающий бас восьмыми, в конце такта октава вверх
  if (st % 2 === 0) mTone(t, mNote(B.bass + (st === 14 ? 12 : 0)), M_STEP * 1.8, 0.075, { cut: 380, det: 4 });
  // мрачный пад, медленно набухает на весь такт
  if (st === 0) for (const n of B.pad) mTone(t, mNote(n), M_STEP * 16, 0.013, { cut: 650, det: 7, att: 0.6 });
  // мелодия с эхом
  const ln = M_LEAD[s & 63];
  if (ln) mTone(t, mNote(ln[0]), M_STEP * ln[1] * 1.05, 0.045, { cut: 1500, det: 6, echo: true, att: 0.04 });
  // драм-машина: глухая бочка, снейр с длинным хвостом, тихие хэты
  if (st === 0 || st === 8) mTone(t, 95, 0.13, 0.14, { type: 'sine', slide: 38, cut: 400 });
  if (st === 4 || st === 12) { mNoise(t, 0.17, 0.05, 1500); mTone(t, 175, 0.08, 0.03, { type: 'triangle', slide: 110 }); }
  if (st % 2 === 0) mNoise(t, 0.035, 0.012, 8000);
}
function musicTick() {
  if (!AC) return;
  while (mNextT < AC.currentTime + 0.3) {
    if (state === 'play') { try { mSchedule(mStep, mNextT); } catch (e) { /* ок */ } }
    mStep = (mStep + 1) & 63;
    mNextT += M_STEP;
  }
}
function startMusic() {
  if (!AC || musicTimer) return;
  musicGain = AC.createGain();
  musicGain.gain.value = 0.85;
  musicGain.connect(AC.destination);
  // эхо «пунктирной восьмой» с обратной связью — фирменная готическая глубина
  musicDelay = AC.createDelay(1.0);
  musicDelay.delayTime.value = M_STEP * 3;
  const fb = AC.createGain(); fb.gain.value = 0.34;
  musicDelay.connect(fb); fb.connect(musicDelay);
  const wet = AC.createGain(); wet.gain.value = 0.5;
  musicDelay.connect(wet); wet.connect(musicGain);
  mStep = 0; mNextT = AC.currentTime + 0.15;
  musicTimer = setInterval(musicTick, 100);
}

// ===================== состояние игры =====================
let state = 'menu';   // menu | play | pause | over | win
let gt = 0;
const player = {
  x: 13.5, y: 23.5, ang: -Math.PI / 2,
  hp: 100, armor: 0,
  z: 0, vz: 0, inWater: false,
  weapon: 0, rockets: 0, cells: 0,
  cool: 0, recoil: 0, bob: 0, hurt: 0, shake: 0, stun: 0,
};
let laserBeam = null;
let enemies = [], shots = [], parts = [], items = [], eshots = [], aoes = [];
let level = 1, wave = 0, score = 0, spawnLeft = 0, spawnT = 0;
let bossSpawned = false;
let banner = '', bannerSub = '', bannerT = 0;
let pickupMsg = '', pickupT = 0;
const zbuf = new Float64Array(W);

const WAVE_SUBS = [
  'Они хотят обнимашек…',
  'Их стало больше!',
  'Они ускоряются!',
  'Пахнет ванильным рафом…',
  'Они зовут подруг!',
  'Держись!',
  'Стало совсем жарко!',
  'Они повсюду!!',
  'Предпоследний рывок!',
  'ФИНАЛЬНАЯ ВОЛНА!!!',
];
const BOSS_NAMES = ['БАРИСТА ЛЮБА', 'НАСТЯ ШИПАСТАЯ', 'КОРОЛЕВА АЛЬТУШЕК'];
const CONTROLS = [
  'WASD — движение · ПРОБЕЛ — прыжок',
  'МЫШЬ / ← → — поворот',
  'ЛКМ — стрелять · 1 / 2 / 3 — оружие',
  'P / ESC — пауза',
];

const globalWave = () => {
  let g = wave;
  for (let i = 0; i < level - 1; i++) g += LEVELS[i].waves;
  return g;
};

function spawnItem(type, minDist) {
  for (let t = 0; t < 80; t++) {
    const p = FREE[(Math.random() * FREE.length) | 0];
    if (Math.hypot(p[0] - player.x, p[1] - player.y) < minDist) continue;
    if (items.some(it => Math.hypot(it.x - p[0], it.y - p[1]) < 1.5)) continue;
    items.push({ x: p[0], y: p[1], type, ph: Math.random() * 6, fh: floorHAt(p[0], p[1]) });
    return;
  }
}

function loadLevel(n) {
  const L = LEVELS[n - 1];
  MAP = L.map;
  computeFree();
  player.x = L.start[0]; player.y = L.start[1]; player.ang = -Math.PI / 2;
  player.z = 0; player.vz = 0;
  enemies = []; shots = []; parts = []; items = []; eshots = []; aoes = [];
  wave = 0; spawnLeft = 0; spawnT = 0;
  bossSpawned = false;
  const drops = ['hp', 'hp', 'armor', 'rocket'];
  if (n >= 2) drops.push('laser', 'laser');   // лазерган со 2-го уровня
  drops.forEach(t => spawnItem(t, 4));
  // гарантированная награда на высокой платформе — стоит запрыгнуть
  const reward = { 1: ['rocket', 13.5, 3.5], 2: ['laser', 13.5, 13.5], 3: ['armor', 13.5, 9.5] }[n];
  if (reward) items.push({ x: reward[1], y: reward[2], type: reward[0], ph: 0, fh: floorHAt(reward[1], reward[2]) });
  banner = `УРОВЕНЬ ${n}`;
  bannerSub = L.name;
  bannerT = 2.8;
  beginWave(false);
}

function beginWave(showBanner) {
  wave++;
  const g = globalWave();
  spawnLeft = Math.min(16, 3 + g * 2);
  spawnT = 0.4;
  if (showBanner) {
    banner = `ВОЛНА ${wave}`;
    bannerSub = WAVE_SUBS[Math.min(g - 1, WAVE_SUBS.length - 1)];
    bannerT = 2.4;
    sfxWave();
  }
  if (g > 1 && items.length < 12) spawnItem('hp', 6); // подкидываем аптечку
}

function startGame() {
  state = 'play';
  startMusic();
  gt = 0;
  player.hp = 100; player.armor = 0;
  player.weapon = 0; player.rockets = 0; player.cells = 0;
  player.z = 0; player.vz = 0; player.inWater = false;
  player.cool = 0; player.recoil = 0;
  player.bob = 0; player.hurt = 0; player.shake = 0; player.stun = 0;
  laserBeam = null;
  score = 0;
  pickupMsg = ''; pickupT = 0;
  level = 1;
  loadLevel(1);
}

function spawnOne() {
  const g = globalWave();
  // со 2-й волны среди обычных попадаются толстушки-обнимашки и кричащие готки
  const roll = Math.random();
  const kind = g >= 2 ? (roll < 0.16 ? 'hug' : roll < 0.34 ? 'scream' : null) : null;
  for (let t = 0; t < 80; t++) {
    const p = FREE[(Math.random() * FREE.length) | 0];
    if (Math.hypot(p[0] - player.x, p[1] - player.y) > 7) {
      const hp = 3 + (g > 5 ? 1 : 0) + (g > 8 ? 1 : 0);
      const spd = 1.3 + g * 0.12 + Math.random() * 0.25;
      enemies.push({
        x: p[0], y: p[1], z: 0, kind,
        hp: kind === 'hug' ? hp + 2 : kind === 'scream' ? Math.max(2, hp - 1) : hp,
        spd: kind === 'hug' ? spd * 0.7 : kind === 'scream' ? spd * 0.9 : spd,
        v: (Math.random() * GIRLS.length) | 0,
        phase: Math.random() * 6,
        dead: false, deadT: 0, hit: 0,
        atkCd: Math.random() * 0.5, atkAnim: 0,
        screamCd: 1 + Math.random(), wanderT: 0, wa: 0,
        aggro: false,
      });
      return;
    }
  }
}

function spawnBoss() {
  bossSpawned = true;
  const hp = 24 + level * 8;
  for (const minD of [8, 5]) {
    for (let t = 0; t < 120; t++) {
      const p = FREE[(Math.random() * FREE.length) | 0];
      if (Math.hypot(p[0] - player.x, p[1] - player.y) > minD) {
        enemies.push({
          boss: true, bv: level - 1, x: p[0], y: p[1], z: 0,
          hp, maxHp: hp,
          spd: 1.0 + level * 0.15,
          v: 0, phase: Math.random() * 6,
          dead: false, deadT: 0, hit: 0,
          atkCd: 1, atkAnim: 0, kissCd: 1.5,
          aoeCd: 3, aoeT: 0, tpCd: 6, raoeCd: 4,
          aggro: true,
        });
        banner = `БОСС: ${BOSS_NAMES[level - 1]}`;
        bannerSub = 'Очаруй её, если сможешь!';
        bannerT = 3;
        sfxBoss();
        return;
      }
    }
  }
}

// урон игроку с учётом брони; в прыжке — уворот
function damagePlayer(base) {
  if (player.z > 0.25) return false;
  let dmg = base;
  if (player.armor > 0) {
    const ab = Math.min(player.armor, Math.ceil(dmg * 0.66));
    player.armor -= ab;
    dmg -= ab;
  }
  player.hp -= dmg;
  player.hurt = 0.5;
  player.shake = 0.35;
  sfxHurt();
  return true;
}

function los(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0);
  const n = Math.ceil(d * 3) + 1;
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (solidAt(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) return false;
  }
  return true;
}

function moveWithCollide(o, dx, dy, r) {
  if (!blocked(o.x + dx, o.y, r)) o.x += dx;
  if (!blocked(o.x, o.y + dy, r)) o.y += dy;
}

function burst(x, y, n, size) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = 0.4 + Math.random() * 1.3;
    parts.push({
      x, y, z: 0.4 + Math.random() * 0.35,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: 0.5 + Math.random() * 0.9,
      life: 0.55 + Math.random() * 0.35, max: 0.9, size,
    });
  }
}

// разлетающееся кольцо сердечек (АОЕ-волна босса)
function ringBurst(x, y, n, r) {
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    parts.push({
      x: x + Math.cos(a) * r, y: y + Math.sin(a) * r, z: 0.15,
      vx: Math.cos(a) * 3.4, vy: Math.sin(a) * 3.4, vz: 1.3,
      life: 0.5, max: 0.5, size: 0.1,
    });
  }
}

function explode(x, y) {
  burst(x, y, 26, 0.12);
  burst(x, y, 8, 0.17);
  player.shake = Math.max(player.shake, 0.5);
  sfxBoom();
  let killed = false, killedBoss = false;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    const dm = d < 1.4 ? 5 : d < 2.6 ? 2 : 0;
    if (dm > 0) {
      e.hp -= dm; e.hit = 0.25; e.aggro = true;
      if (e.hp <= 0) {
        e.dead = true; e.deadT = 0;
        score += e.boss ? 250 + level * 250 : 100;
        killed = true;
        if (e.boss) killedBoss = true;
        burst(e.x, e.y, e.boss ? 30 : 12, e.boss ? 0.13 : 0.1);
      }
    }
  }
  if (killed) { sfxCharm(); sfxMoan(killedBoss); }
}

function fireLaser() {
  const dx = Math.cos(player.ang), dy = Math.sin(player.ang);
  player.cells--;
  player.cool = LASER_CD;
  player.recoil = 0.5;
  sfxLaser();
  // дистанция до стены или ящика выше уровня глаз
  const eyeZ = player.z + 0.5;
  let dist = 0;
  while (dist < 24 && !solidAt(player.x + dx * dist, player.y + dy * dist)
         && floorHAt(player.x + dx * dist, player.y + dy * dist) <= eyeZ) dist += 0.06;
  const ex = player.x + dx * dist, ey = player.y + dy * dist;
  // лазер прошивает всех альтушек на линии
  for (const e of enemies) {
    if (e.dead) continue;
    const t = (e.x - player.x) * dx + (e.y - player.y) * dy;
    if (t < 0 || t > dist) continue;
    const px = player.x + dx * t, py = player.y + dy * t;
    if (Math.hypot(e.x - px, e.y - py) < (e.boss ? 0.55 : e.kind === 'hug' ? 0.52 : 0.42)) {
      e.hp -= 0.63; e.hit = 0.12; e.aggro = true;
      if (e.hp <= 0) {
        e.dead = true; e.deadT = 0;
        score += e.boss ? 250 + level * 250 : 100;
        sfxCharm();
        sfxMoan(e.boss);
        burst(e.x, e.y, e.boss ? 22 : 10, 0.09);
      } else if (Math.random() < 0.4) burst(px, py, 2, 0.05);
    }
  }
  laserBeam = { x1: ex, y1: ey, t: LASER_CD * 1.4 };
}

function shoot() {
  const dx = Math.cos(player.ang), dy = Math.sin(player.ang);
  // выстрел — это шум: альтушки в округе просыпаются, даже за стеной (как в Doom)
  for (const e of enemies)
    if (!e.dead && Math.hypot(e.x - player.x, e.y - player.y) < 10) e.aggro = true;
  if (player.weapon === 2) {
    if (player.cells <= 0) { player.weapon = 0; return; }
    fireLaser();
    return;
  }
  if (player.weapon === 1) {
    if (player.rockets <= 0) { player.weapon = 0; return; }
    player.rockets--;
    player.cool = MEGA_CD;
    player.recoil = 1;
    sfxShootMega();
    shots.push({
      mega: true,
      x: player.x + dx * 0.6, y: player.y + dy * 0.6, z: player.z + 0.5,
      dx: dx * 9, dy: dy * 9, life: 4, seed: Math.random() * 6,
    });
  } else {
    player.cool = SHOT_CD;
    player.recoil = 1;
    sfxShoot();
    shots.push({
      x: player.x + dx * 0.5, y: player.y + dy * 0.5, z: player.z + 0.5,
      dx: dx * 13, dy: dy * 13, life: 3, seed: Math.random() * 6,
    });
  }
}

function pickup(it) {
  if (it.type === 'hp') {
    if (player.hp >= 100) return false;
    player.hp = Math.min(100, player.hp + 25);
    pickupMsg = '+25 ЗДОРОВЬЯ 💗';
  } else if (it.type === 'armor') {
    if (player.armor >= 100) return false;
    player.armor = Math.min(100, player.armor + 50);
    pickupMsg = 'БРОНЯ +50 🛡';
  } else if (it.type === 'laser') {
    player.cells += 50;
    player.weapon = 2;
    pickupMsg = `ЛАЗЕРГАН! ЗАРЯД ×${player.cells}`;
  } else {
    player.rockets += 4;
    player.weapon = 1;
    pickupMsg = `РАКЕТНИЦА! МЕГА-СЕРДЕЧКИ ×${player.rockets}`;
  }
  pickupT = 2;
  sfxPickup();
  return true;
}

// ===================== обновление =====================
function updateEnemy(e, dt) {
  if (e.dead) { e.deadT += dt; return; }
  e.hit -= dt; e.atkCd -= dt; e.atkAnim -= dt;
  e.z = floorHAt(e.x, e.y);                          // высота под ногами (для отрисовки)
  const slow = isWaterAt(e.x, e.y) ? 0.55 : 1;       // в воде медленнее
  const ddx = player.x - e.x, ddy = player.y - e.y;
  const d = Math.hypot(ddx, ddy);
  if (e.boss) {
    e.kissCd -= dt;
    // АОЕ-волна обнимашек (Настя и Королева): замах в ближнем бою — отпрыгивай или беги!
    if (e.bv >= 1) {
      e.aoeCd -= dt;
      if (e.aoeT > 0) {
        e.aoeT -= dt;
        if (Math.random() < dt * 26) burst(e.x, e.y, 1, 0.06);   // искрит при замахе
        if (e.aoeT <= 0) {
          ringBurst(e.x, e.y, 26, 0.5);
          sfxAoe();
          if (d < 2.7 && damagePlayer(15 + Math.floor(Math.random() * 6)))
            player.shake = Math.max(player.shake, 0.6);
        }
      } else if (d < 2.2 && e.aoeCd <= 0) {
        e.aoeCd = 5.5;
        e.aoeT = 0.6;
        e.atkAnim = 0.6;
        sfxAoeCharge();
      }
      // и периодически кастует АОЕ-зону прямо по позиции игрока — не стой на месте!
      if (e.aoeT <= 0) {
        e.raoeCd -= dt;
        if (e.raoeCd <= 0 && d > 2.2 && d < 13 && los(e.x, e.y, player.x, player.y)) {
          e.raoeCd = e.bv === 2 ? 5.5 : 7;
          aoes.push({ x: player.x, y: player.y, t: 0.85, r: 2.1 });
          e.atkAnim = 0.5;
          sfxAoeCharge();
        }
      }
    }
    // телепорт Королевы: раз в ~6 секунд переносится поближе к игроку
    if (e.bv === 2 && e.aoeT <= 0) {
      e.tpCd -= dt;
      if (e.tpCd <= 0) {
        e.tpCd = 5 + Math.random() * 3;
        for (let t = 0; t < 60; t++) {
          const p = FREE[(Math.random() * FREE.length) | 0];
          const pd = Math.hypot(p[0] - player.x, p[1] - player.y);
          if (pd > 2.2 && pd < 5.5) {
            burst(e.x, e.y, 16, 0.09);
            e.x = p[0]; e.y = p[1]; e.z = floorHAt(e.x, e.y);
            burst(e.x, e.y, 16, 0.09);
            e.kissCd = Math.min(e.kissCd, 0.35);
            sfxTeleport();
            break;
          }
        }
      }
    }
    if (e.aoeT > 0) {
      e.phase += dt * 10;   // замахивается, стоя на месте
    } else if (d > 0.95) {
      // вблизи замедляется и закидывает поцелуями
      const s = e.spd * (d > 6 ? 1 : 0.45) * dt * slow;
      moveWithCollide(e, ddx / d * s, ddy / d * s, 0.34);
      e.phase += dt * 5;
    } else if (e.atkCd <= 0) {
      e.atkCd = 1.2;
      e.atkAnim = 0.45;
      damagePlayer(12 + Math.floor(Math.random() * 6));
    }
    if (e.aoeT <= 0 && d > 1.5 && d < 11 && e.kissCd <= 0 && los(e.x, e.y, player.x, player.y)) {
      e.kissCd = 1.6 - level * 0.15;
      e.atkAnim = 0.45;
      const a = Math.atan2(ddy, ddx);
      eshots.push({
        x: e.x + Math.cos(a) * 0.4, y: e.y + Math.sin(a) * 0.4, z: (e.z || 0) + 0.5,
        dx: Math.cos(a) * 5.5, dy: Math.sin(a) * 5.5, life: 4,
      });
      sfxKiss();
    }
    return;
  }
  if (!e.aggro && d < 16 && los(e.x, e.y, player.x, player.y)) e.aggro = true;
  if (!e.aggro) {
    // пока не заметила игрока — лениво бродит по лабиринту
    e.wanderT -= dt;
    if (e.wanderT <= 0) { e.wanderT = 2 + Math.random() * 2; e.wa = Math.random() * TAU; }
    const s = e.spd * 0.35 * dt * slow;
    moveWithCollide(e, Math.cos(e.wa) * s, Math.sin(e.wa) * s, 0.26);
    e.phase += dt * 2.5;
    return;
  }
  const rad = e.kind === 'hug' ? 0.3 : 0.26;
  // толстушка добралась: замах объятий, потом стан + взрыв сердечками (сама растворяется)
  if (e.fuse !== undefined) {
    e.fuse -= dt;
    if (Math.random() < dt * 30) burst(e.x, e.y, 1, 0.07);
    if (e.fuse <= 0) {
      ringBurst(e.x, e.y, 22, 0.45);
      sfxAoe();
      if (d < 1.4 && damagePlayer(18 + Math.floor(Math.random() * 7))) {
        player.stun = 1.1;
        player.shake = Math.max(player.shake, 0.7);
      }
      e.dead = true; e.deadT = 0;   // без очков — игрок её не очаровывал
      sfxMoan(false);
    }
    return;
  }
  // готка держит дистанцию и кричит — звуковая волна летит в игрока
  if (e.kind === 'scream' && d > 1.5) {
    e.screamCd -= dt;
    const see = d < 11 && los(e.x, e.y, player.x, player.y);
    if (see && e.screamCd <= 0) {
      e.screamCd = 2.4;
      e.atkAnim = 0.5;
      const a = Math.atan2(ddy, ddx);
      eshots.push({
        wave: true,
        x: e.x + Math.cos(a) * 0.35, y: e.y + Math.sin(a) * 0.35, z: (e.z || 0) + 0.5,
        dx: Math.cos(a) * 4.2, dy: Math.sin(a) * 4.2, life: 4,
      });
      sfxScream();
    }
    if (!see || d > 8) {            // сближается, пока не выйдет на дистанцию крика
      const s = e.spd * dt * slow;
      moveWithCollide(e, ddx / d * s, ddy / d * s, 0.26);
      e.phase += dt * 7;
    } else e.phase += dt * 2;
    return;
  }
  if (d > 0.85) {
    const s = e.spd * dt * slow;
    moveWithCollide(e, ddx / d * s, ddy / d * s, rad);
    e.phase += dt * 7;
  } else if (e.kind === 'hug') {
    e.fuse = 0.45;
    e.atkAnim = 0.6;
    sfxAoeCharge();
  } else if (e.atkCd <= 0) {
    e.atkCd = 1.05;
    e.atkAnim = 0.4;
    damagePlayer(6 + Math.floor(Math.random() * 6));
  }
}

function update(dt) {
  gt += dt;
  if (state !== 'play') return;

  // движение игрока (с учётом воды и приподнятых платформ)
  const dirX = Math.cos(player.ang), dirY = Math.sin(player.ang);
  let mx = 0, my = 0;
  if (keys.KeyW || keys.ArrowUp) { mx += dirX; my += dirY; }
  if (keys.KeyS || keys.ArrowDown) { mx -= dirX; my -= dirY; }
  if (keys.KeyA) { mx += dirY; my -= dirX; }
  if (keys.KeyD) { mx -= dirY; my += dirX; }
  const wasWater = player.inWater;
  player.inWater = isWaterAt(player.x, player.y);
  if (player.inWater && !wasWater) sfxSplash();
  const ml = Math.hypot(mx, my);
  if (ml > 0 && player.stun <= 0) {   // в обнимашках не пошевелиться
    const sp = (player.inWater ? 1.85 : 3.7) * dt;
    const ux = mx / ml * sp, uy = my / ml * sp;
    // шагнуть можно, если нет стены и уступ не выше STEPUP (иначе нужно перепрыгнуть)
    if (!blocked(player.x + ux, player.y, 0.22) && floorHAt(player.x + ux, player.y) - player.z <= STEPUP) player.x += ux;
    if (!blocked(player.x, player.y + uy, 0.22) && floorHAt(player.x, player.y + uy) - player.z <= STEPUP) player.y += uy;
    if (player.z <= floorHAt(player.x, player.y) + 0.02) player.bob += dt * (player.inWater ? 5 : 9);
  }
  if (keys.ArrowLeft) player.ang -= 2.6 * dt;
  if (keys.ArrowRight) player.ang += 2.6 * dt;

  // прыжок и гравитация к высоте пола/платформы под игроком
  const groundZ = floorHAt(player.x, player.y);
  const grounded = player.z <= groundZ + 0.02 && player.vz <= 0.01;
  if (keys.Space && grounded && player.stun <= 0) { player.vz = JUMP_V; sfxJump(); }
  player.vz -= GRAV * dt;
  player.z += player.vz * dt;
  if (player.z <= groundZ) { player.z = groundZ; player.vz = 0; }

  // стрельба
  player.cool -= dt;
  player.recoil = Math.max(0, player.recoil - dt * 5);
  if (mouseDown && player.cool <= 0 && player.stun <= 0) shoot();

  // подбор предметов (нужно быть на той же высоте — за наградой на платформе прыгай)
  items = items.filter(it => {
    if (Math.hypot(it.x - player.x, it.y - player.y) < 0.6 && Math.abs(player.z - (it.fh || 0)) < 0.4)
      return !pickup(it);
    return true;
  });

  // волны, босс и уровни
  const alive = enemies.some(e => !e.dead);
  if (!alive && spawnLeft <= 0) {
    if (wave >= LEVELS[level - 1].waves) {
      if (!bossSpawned) {
        spawnBoss();
      } else if (level >= LEVELS.length) {
        state = 'win';
        sfxWin();
        if (document.exitPointerLock) document.exitPointerLock();
        return;
      } else {
        level++;
        loadLevel(level);
        sfxWave();
      }
    } else {
      beginWave(true);
    }
  }
  if (spawnLeft > 0) {
    spawnT -= dt;
    if (spawnT <= 0) { spawnT = 0.35; spawnOne(); spawnLeft--; }
  }

  // враги
  for (const e of enemies) updateEnemy(e, dt);
  // расталкивание
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (a.dead) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      if (d > 0.001 && d < 0.55) {
        const p = 0.5 * (0.55 - d);
        moveWithCollide(a, -dx / d * p, -dy / d * p, 0.26);
        moveWithCollide(b, dx / d * p, dy / d * p, 0.26);
      }
    }
  }
  enemies = enemies.filter(e => !(e.dead && e.deadT > (e.boss ? 1.3 : 0.9)));

  // сердечки-снаряды
  for (const s of shots) {
    s.x += s.dx * dt; s.y += s.dy * dt;
    s.life -= dt;
    if (solidAt(s.x, s.y) || floorHAt(s.x, s.y) > s.z) {
      if (s.mega) explode(s.x - s.dx * dt, s.y - s.dy * dt);
      else burst(s.x - s.dx * dt, s.y - s.dy * dt, 4, 0.06);
      s.life = 0;
      continue;
    }
    const rad = s.mega ? 0.55 : 0.45;
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) < rad + (e.boss ? 0.15 : e.kind === 'hug' ? 0.1 : 0)) {
        s.life = 0;
        if (s.mega) { explode(s.x, s.y); break; }
        e.hp--; e.hit = 0.18; e.aggro = true;
        if (e.hp <= 0) {
          e.dead = true; e.deadT = 0;
          score += e.boss ? 250 + level * 250 : 100;
          sfxCharm();
          sfxMoan(e.boss);
          if (e.boss) { sfxBoom(); player.shake = Math.max(player.shake, 0.5); }
          burst(e.x, e.y, e.boss ? 30 : 14, e.boss ? 0.13 : 0.1);
        } else {
          sfxHit();
          burst(s.x, s.y, 5, 0.06);
        }
        break;
      }
    }
  }
  shots = shots.filter(s => s.life > 0);

  // поцелуи босса
  for (const k of eshots) {
    k.x += k.dx * dt; k.y += k.dy * dt;
    k.life -= dt;
    if (solidAt(k.x, k.y) || floorHAt(k.x, k.y) > k.z) {
      burst(k.x - k.dx * dt, k.y - k.dy * dt, 3, 0.05);
      k.life = 0;
      continue;
    }
    if (player.z <= 0.25 && Math.hypot(player.x - k.x, player.y - k.y) < (k.wave ? 0.5 : 0.4)) {
      k.life = 0;
      damagePlayer(k.wave ? 8 + Math.floor(Math.random() * 4) : 9 + Math.floor(Math.random() * 5));
    }
  }
  eshots = eshots.filter(k => k.life > 0);

  // АОЕ-зоны боссов: кольцо-телеграф из сердечек, затем взрыв
  for (const a of aoes) {
    a.t -= dt;
    if (Math.random() < dt * 50) {
      const an = Math.random() * TAU;
      parts.push({
        x: a.x + Math.cos(an) * a.r, y: a.y + Math.sin(an) * a.r, z: 0.05,
        vx: 0, vy: 0, vz: 0.9, life: 0.35, max: 0.35, size: 0.07,
      });
    }
    if (a.t <= 0) {
      ringBurst(a.x, a.y, 30, 0.4);
      sfxAoe();
      if (Math.hypot(player.x - a.x, player.y - a.y) < a.r &&
          damagePlayer(13 + Math.floor(Math.random() * 5)))
        player.shake = Math.max(player.shake, 0.55);
    }
  }
  aoes = aoes.filter(a => a.t > 0);

  // частицы
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.vz -= 0.4 * dt;
    p.life -= dt;
  }
  parts = parts.filter(p => p.life > 0 && p.z > 0 && p.z < 1.2);

  if (laserBeam) { laserBeam.t -= dt; if (laserBeam.t <= 0) laserBeam = null; }
  player.hurt = Math.max(0, player.hurt - dt);
  player.shake = Math.max(0, player.shake - dt);
  player.stun = Math.max(0, player.stun - dt);
  bannerT -= dt;
  pickupT = Math.max(0, pickupT - dt);

  if (player.hp <= 0) {
    player.hp = 0;
    state = 'over';
    sfxLose();
    if (document.exitPointerLock) document.exitPointerLock();
  }
}

// ===================== рендер =====================
function render() {
  ctx.save();
  if (player.shake > 0)
    ctx.translate((Math.random() - 0.5) * 10 * player.shake, (Math.random() - 0.5) * 10 * player.shake);

  const camZ0 = 0.5 + Math.min(0.45, player.z);   // высота глаз (прыжок/платформа)
  const camZ = player.inWater && player.z <= 0.02 ? camZ0 - 0.06 : camZ0;  // в воде ниже
  const dirX = Math.cos(player.ang), dirY = Math.sin(player.ang);
  const plX = -dirY * FOV, plY = dirX * FOV;

  // потолок (плоский) + пол с водой (floor casting)
  ctx.fillStyle = ceilGrad; ctx.fillRect(0, 0, W, HALF);
  castFloor(camZ, dirX, dirY, plX, plY);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, VIEW_H); ctx.clip();

  // стены (DDA) + приподнятые платформы
  const platOcc = [];   // по колоннам: силуэты платформ для отсечения спрайтов
  for (let x = 0; x < W; x += COLW) {
    const camX = 2 * x / W - 1;
    const rdx = dirX + plX * camX, rdy = dirY + plY * camX;
    const ddx = Math.abs(1 / rdx), ddy = Math.abs(1 / rdy);
    let mapX = Math.floor(player.x), mapY = Math.floor(player.y);
    let stepX, stepY, sideX, sideY;
    if (rdx < 0) { stepX = -1; sideX = (player.x - mapX) * ddx; }
    else { stepX = 1; sideX = (mapX + 1 - player.x) * ddx; }
    if (rdy < 0) { stepY = -1; sideY = (player.y - mapY) * ddy; }
    else { stepY = 1; sideY = (mapY + 1 - player.y) * ddy; }
    let side = 0, hit = '1', wallPerp = 50;
    const cells = [];   // пройденные не-стены: {perp, h, side}
    for (let i = 0; i < 80; i++) {
      let perpEnter;
      if (sideX < sideY) { perpEnter = sideX; sideX += ddx; mapX += stepX; side = 0; }
      else { perpEnter = sideY; sideY += ddy; mapY += stepY; side = 1; }
      const ch = (mapX < 0 || mapY < 0 || mapX >= MW || mapY >= MH) ? '1' : MAP[mapY][mapX];
      if (isWall(ch)) { hit = ch; wallPerp = perpEnter; break; }
      cells.push({ perp: perpEnter, h: PLATH[ch] || 0, side });
    }
    for (let k = 0; k < COLW; k++) zbuf[x + k] = wallPerp;

    // дальняя стена
    const perp = Math.max(0.05, wallPerp);
    let wallX = side === 0 ? player.y + perp * rdy : player.x + perp * rdx;
    wallX -= Math.floor(wallX);
    let texX = Math.floor(wallX * 64);
    if ((side === 0 && rdx > 0) || (side === 1 && rdy < 0)) texX = 63 - texX;
    const lineH = VIEW_H / perp;
    const y0 = VIEW_H / 2 - (1 - camZ) * lineH;
    ctx.drawImage(TEX[hit], texX, 0, 1, 64, x, y0, COLW, lineH);
    const si = Math.round(Math.min(0.85, perp / 13 + (side ? 0.16 : 0)) * 20);
    if (si > 0) { ctx.fillStyle = SHADES[si]; ctx.fillRect(x, y0, COLW, lineH); }

    // платформы: рисуем от дальних к ближним (painter's), крышка + передняя грань
    for (let ci = cells.length - 1; ci >= 0; ci--) {
      const cur = cells[ci];
      if (cur.h <= 0) continue;
      const near = cur.perp;
      const far = ci + 1 < cells.length ? cells[ci + 1].perp : wallPerp;
      const prevH = ci > 0 ? cells[ci - 1].h : 0;
      const yTopNear = VIEW_H / 2 + (VIEW_H / near) * (camZ - cur.h);
      const yTopFar = VIEW_H / 2 + (VIEW_H / Math.max(0.05, far)) * (camZ - cur.h);
      (platOcc[x] || (platOcc[x] = [])).push({ far, y: Math.min(yTopNear, yTopFar) });
      // верхняя крышка
      if (yTopNear > yTopFar + 0.5) {
        ctx.fillStyle = cur.h > 0.5 ? '#4a2a5e' : '#3a2750';
        ctx.fillRect(x, yTopFar, COLW, yTopNear - yTopFar);
        const fog = Math.round(Math.min(0.7, near / 13) * 20);
        if (fog > 0) { ctx.fillStyle = SHADES[fog]; ctx.fillRect(x, yTopFar, COLW, yTopNear - yTopFar); }
        ctx.fillStyle = 'rgba(255,79,168,0.5)'; ctx.fillRect(x, yTopNear - 2, COLW, 2); // неон спереди
      }
      // передняя грань (riser) от prevH до h
      if (cur.h > prevH) {
        const yB = VIEW_H / 2 + (VIEW_H / near) * (camZ - prevH);
        if (yB > yTopNear) {
          let rtx = (cur.side === 0 ? player.y + near * rdy : player.x + near * rdx);
          rtx -= Math.floor(rtx);
          ctx.drawImage(TEX['3'], Math.floor(rtx * 64), 0, 1, 64, x, yTopNear, COLW, yB - yTopNear);
          ctx.fillStyle = 'rgba(110,40,150,0.42)'; ctx.fillRect(x, yTopNear, COLW, yB - yTopNear);
          ctx.fillStyle = '#ff4fa8'; ctx.fillRect(x, yTopNear, COLW, 2);
        }
      }
    }
  }

  // спрайты: враги, предметы, сердечки, частицы
  const view = [];
  const inv = 1 / (plX * dirY - dirX * plY);
  const pushSprite = (img, wx, wy, hFrac, zC, alpha) => {
    const rx = wx - player.x, ry = wy - player.y;
    const depth = inv * (-plY * rx + plX * ry);
    if (depth < 0.12) return;
    const tx = inv * (dirY * rx - dirX * ry);
    view.push({ img, d: depth, sx: (W / 2) * (1 + tx / depth), hFrac, zC, alpha });
  };
  for (const e of enemies) {
    const hF = e.boss ? 1.0 : 0.85;
    const ez = e.z || 0;
    let a = 1, zC = ez + hF / 2;
    if (e.dead) {
      const t = e.deadT / (e.boss ? 1.3 : 0.9);
      a = Math.max(0, 1 - t);
      zC = ez + hF / 2 - 0.45 * t;
    } else {
      if (e.aggro) zC += Math.sin(e.phase * 2) * 0.008;
      if (e.hit > 0 && Math.floor(gt * 40) % 2 === 0) a = 0.45;
    }
    const fr = (e.atkAnim > 0 || e.dead) ? 2 : (Math.floor(e.phase) % 2);
    const img = e.boss ? bossSprites[e.bv][fr]
      : e.kind === 'hug' ? fatSprites[fr]
      : e.kind === 'scream' ? gothSprites[fr]
      : girlSprites[e.v][fr];
    pushSprite(img, e.x, e.y, hF, zC, a);
  }
  for (const k of eshots)
    pushSprite(k.wave ? waveImg : kissImg, k.x, k.y,
      k.wave ? 0.3 + 0.05 * Math.sin(gt * 22) : 0.13 + 0.02 * Math.sin(gt * 16), k.z ?? 0.5, 1);
  for (const it of items)
    pushSprite(ITEM_IMG[it.type], it.x, it.y, 0.22, (it.fh || 0) + 0.16 + Math.sin(gt * 2.5 + it.ph) * 0.02, 1);
  for (const s of shots) {
    if (s.mega) pushSprite(heartMega, s.x, s.y, 0.36 + 0.05 * Math.sin(gt * 14 + s.seed), s.z ?? 0.5, 1);
    else pushSprite(heartImg, s.x, s.y, 0.2 + 0.03 * Math.sin(gt * 18 + s.seed), s.z ?? 0.5, 1);
  }
  for (const p of parts)
    pushSprite(heartSmall, p.x, p.y, p.size, Math.min(1, p.z), Math.max(0, p.life / p.max));

  view.sort((a, b) => b.d - a.d);
  for (const d of view) {
    const fullH = VIEW_H / d.d;
    const sh = d.hFrac * fullH;
    const sw2 = sh * (d.img.width / d.img.height);
    const yC = VIEW_H / 2 + fullH * (camZ - d.zC);
    const y0 = yC - sh / 2;
    const xL = d.sx - sw2 / 2;
    const srcW = Math.max(1, d.img.width / (sw2 / COLW));
    if (d.alpha < 1) ctx.globalAlpha = d.alpha;
    const start = Math.max(0, Math.floor(xL / COLW) * COLW);
    const end = Math.min(W, Math.ceil(xL + sw2));
    for (let x = start; x < end; x += COLW) {
      if (zbuf[x] <= d.d) continue;
      // отсечение по силуэтам платформ перед спрайтом (за ящиком видно только верх)
      let clip = VIEW_H;
      const po = platOcc[x];
      if (po) for (const q of po) if (q.far < d.d && q.y < clip) clip = q.y;
      if (clip <= y0) continue;
      const vh = Math.min(sh, clip - y0);
      const u = Math.min(d.img.width - srcW, Math.max(0, (x - xL) / sw2 * d.img.width));
      ctx.drawImage(d.img, u, 0, srcW, d.img.height * vh / sh, x, y0, COLW, vh);
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore(); // клип вида

  // виньетка и вспышка урона
  ctx.drawImage(vig, 0, 0);
  if (player.hurt > 0) {
    ctx.fillStyle = `rgba(255,40,90,${(player.hurt * 0.8).toFixed(2)})`;
    ctx.fillRect(0, 0, W, VIEW_H);
  }

  // стан от обнимашек: розовая пелена, хоровод сердечек
  if (state === 'play' && player.stun > 0) {
    ctx.fillStyle = 'rgba(255,90,160,0.20)';
    ctx.fillRect(0, 0, W, VIEW_H);
    ctx.globalAlpha = Math.min(1, player.stun * 2.5);
    ctx.fillStyle = '#ff4fa8';
    for (let i = 0; i < 6; i++) {
      const a = gt * 2.4 + i / 6 * TAU;
      heartPath(ctx, W / 2 + Math.cos(a) * 150, VIEW_H / 2 - 30 + Math.sin(a) * 70, 15);
      ctx.fill();
    }
    ctx.font = 'bold 32px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd1e8';
    ctx.fillText('ОБНИМАШКИ!', W / 2, VIEW_H / 2 - 110);
    ctx.globalAlpha = 1;
  }

  // оружие и прицел
  if (state === 'play' || state === 'pause') {
    if (laserBeam && laserBeam.t > 0) drawLaserBeam();
    drawWeapon();
    ctx.strokeStyle = 'rgba(255,130,190,0.95)';
    ctx.lineWidth = 2;
    heartPath(ctx, W / 2, VIEW_H / 2, 12);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,130,190,0.95)';
    ctx.fillRect(W / 2 - 1, VIEW_H / 2 - 1, 2, 2);
  }

  ctx.restore(); // тряска

  drawHUD();

  // сообщение о подборе
  if (pickupT > 0 && (state === 'play' || state === 'pause')) {
    ctx.globalAlpha = Math.min(1, pickupT / 0.4);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd1e8';
    ctx.font = 'bold 22px "Courier New",monospace';
    ctx.fillText(pickupMsg, W / 2, VIEW_H - 36);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // полоска здоровья босса
  if (state === 'play' || state === 'pause') {
    const b = enemies.find(e => e.boss && !e.dead);
    if (b) {
      const bw = 440, bx = (W - bw) / 2, by = 30;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff7fc0';
      ctx.font = 'bold 15px "Courier New",monospace';
      ctx.fillText(`💋 ${BOSS_NAMES[level - 1]}`, W / 2, by - 8);
      ctx.fillStyle = 'rgba(10,6,14,0.8)'; ctx.fillRect(bx, by, bw, 16);
      ctx.fillStyle = '#ff2f7e';
      ctx.fillRect(bx + 2, by + 2, (bw - 4) * Math.max(0, b.hp) / b.maxHp, 12);
      ctx.strokeStyle = '#ff7fc0'; ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bw, 16);
      ctx.textAlign = 'left';
    }
  }

  // баннер волны/уровня
  if (state === 'play' && bannerT > 0) {
    ctx.globalAlpha = Math.min(1, bannerT / 0.5);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#5e1030';
    ctx.font = 'bold 56px "Courier New",monospace';
    ctx.fillText(banner, W / 2 + 3, 203);
    ctx.fillStyle = '#ff4fa8';
    ctx.fillText(banner, W / 2, 200);
    ctx.fillStyle = '#ffd1e8';
    ctx.font = '20px "Courier New",monospace';
    ctx.fillText(bannerSub, W / 2, 238);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  if (state === 'menu') drawMenu();
  else if (state === 'pause') drawPause();
  else if (state === 'over') drawEnd(false);
  else if (state === 'win') drawEnd(true);
}

function drawLaserBeam() {
  const a = Math.min(1, laserBeam.t / (LASER_CD * 1.4));
  const cx = W / 2 + (Math.random() - 0.5) * 4, top = VIEW_H / 2, bot = VIEW_H - 40;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const grd = ctx.createLinearGradient(cx - 46, 0, cx + 46, 0);
  grd.addColorStop(0, 'rgba(255,47,126,0)');
  grd.addColorStop(0.5, `rgba(255,79,168,${0.85 * a})`);
  grd.addColorStop(1, 'rgba(255,47,126,0)');
  ctx.fillStyle = grd; ctx.fillRect(cx - 46, top, 92, bot - top);
  ctx.fillStyle = `rgba(255,79,168,${a})`; ctx.fillRect(cx - 14, top, 28, bot - top);
  ctx.fillStyle = `rgba(255,235,248,${a})`; ctx.fillRect(cx - 5, top, 10, bot - top);
  // вспышка в точке попадания (на горизонте/прицеле)
  ctx.beginPath(); ctx.arc(W / 2, top, 16 * a + 6, 0, TAU);
  ctx.fillStyle = `rgba(255,240,250,${a})`; ctx.fill();
  ctx.beginPath(); ctx.arc(W / 2, top, 30 * a + 8, 0, TAU);
  ctx.fillStyle = `rgba(255,79,168,${0.5 * a})`; ctx.fill();
  ctx.restore();
}

function drawWeapon() {
  const bobX = Math.sin(player.bob) * 14;
  const bobY = Math.abs(Math.cos(player.bob)) * 9;
  const rec = player.recoil;
  if (player.weapon === 1) {
    // ракетница мега-сердечек
    const hx = W / 2 + bobX, hy = VIEW_H + 44 + bobY + rec * 60;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.fillStyle = '#23212c'; rr(ctx, -56, -158, 112, 168, 18); ctx.fill();
    ctx.fillStyle = '#2f2c3a'; rr(ctx, -44, -158, 88, 20, 8); ctx.fill();
    ctx.fillStyle = '#0c0a12';
    ctx.beginPath(); ctx.ellipse(0, -158, 50, 15, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff2f7e'; ctx.fillRect(-56, -84, 112, 6);
    ctx.fillStyle = '#1a1824'; ctx.fillRect(-56, -40, 112, 5);
    // руки по бокам
    ctx.fillStyle = '#f4ddcf';
    ctx.beginPath(); ctx.arc(-50, -48, 15, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(50, -98, 15, 0, TAU); ctx.fill();
    ctx.restore();
    // мега-сердце в дуле
    if (player.rockets > 0) {
      const ready = 1 - Math.max(0, player.cool) / MEGA_CD;
      const s = 46 * (0.3 + 0.7 * ready);
      ctx.shadowColor = '#ff2f7e'; ctx.shadowBlur = 26;
      heartPath(ctx, hx, hy - 162 + rec * 24, s);
      ctx.fillStyle = '#ff2f7e'; ctx.fill();
      ctx.shadowBlur = 0;
    }
  } else if (player.weapon === 2) {
    // лазерган с сердечным эмиттером
    const hx = W / 2 + 30 + bobX, hy = VIEW_H + 36 + bobY + rec * 50;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(-0.12);
    ctx.fillStyle = '#201d29'; rr(ctx, -34, -150, 62, 170, 12); ctx.fill();
    ctx.fillStyle = '#2c2838'; rr(ctx, -34, -150, 62, 22, 10); ctx.fill();
    ctx.fillStyle = '#34e0ac'; rr(ctx, -18, -178, 30, 32, 6); ctx.fill();   // эмиттер
    ctx.fillStyle = '#ff2f7e'; ctx.fillRect(-34, -96, 62, 6);
    ctx.fillStyle = '#15121a'; ctx.fillRect(-34, -52, 62, 6);
    ctx.fillStyle = '#f4ddcf'; ctx.beginPath(); ctx.arc(-30, -40, 15, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.shadowColor = '#ff2f7e'; ctx.shadowBlur = player.cells > 0 ? 22 : 4;
    heartPath(ctx, hx - 4, hy - 168, 28);
    ctx.fillStyle = player.cells > 0 ? '#ff2f7e' : '#5a3a48'; ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    // рука с сердечком
    const hx = W / 2 + 36 + bobX, hy = VIEW_H + 30 + bobY + rec * 50;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(-0.16);
    ctx.fillStyle = '#f4ddcf'; rr(ctx, -20, -96, 40, 124, 18); ctx.fill();
    ctx.fillStyle = '#1c1a24'; rr(ctx, -25, -42, 50, 84, 12); ctx.fill(); // рукав
    ctx.fillStyle = '#f4ddcf';
    ctx.beginPath(); ctx.arc(0, -96, 24, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, -104); ctx.lineTo(-12, -88);
    ctx.moveTo(-2, -107); ctx.lineTo(-2, -88);
    ctx.moveTo(8, -105); ctx.lineTo(8, -89);
    ctx.stroke();
    ctx.restore();
    // сердечко «перезаряжается» — растёт после выстрела
    const ready = 1 - Math.max(0, player.cool) / SHOT_CD;
    const s = 54 * (0.35 + 0.65 * ready);
    ctx.shadowColor = '#ff4fa8'; ctx.shadowBlur = 22;
    heartPath(ctx, hx - 8, hy - 138 + rec * 22, s);
    ctx.fillStyle = '#ff4fa8'; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.ellipse(hx - 8 - s * 0.16, hy - 138 + rec * 22 - s * 0.16, s * 0.08, s * 0.14, -0.6, 0, TAU);
    ctx.fill();
  }
}

function drawFace() {
  const s = 96, bx = W / 2 - s / 2, by = VIEW_H + 12;
  ctx.fillStyle = '#15141a'; rr(ctx, bx, by, s, s, 6); ctx.fill();
  ctx.strokeStyle = '#3a3744'; ctx.lineWidth = 2; rr(ctx, bx, by, s, s, 6); ctx.stroke();
  const cx2 = bx + s / 2, cy2 = by + s / 2 + 4;
  const hp = player.hp, hurt = player.hurt > 0.25;
  ctx.fillStyle = '#e8c39e'; rr(ctx, cx2 - 26, cy2 - 30, 52, 60, 14); ctx.fill();
  ctx.fillStyle = '#4a3526';
  ctx.beginPath(); ctx.arc(cx2, cy2 - 22, 27, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx2 - 27, cy2 - 26, 54, 8);
  if (hurt) {
    ctx.strokeStyle = '#3a2417'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx2 - 17, cy2 - 9); ctx.lineTo(cx2 - 6, cy2 - 5);
    ctx.moveTo(cx2 + 6, cy2 - 5); ctx.lineTo(cx2 + 17, cy2 - 9);
    ctx.stroke();
    ctx.fillStyle = '#5e2030';
    ctx.beginPath(); ctx.ellipse(cx2, cy2 + 16, 7, 9, 0, 0, TAU); ctx.fill();
  } else {
    const look = Math.sin(gt * 0.9) > 0 ? 3 : -3;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx2 - 11, cy2 - 7, 8, 6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx2 + 11, cy2 - 7, 8, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#33271f';
    ctx.beginPath(); ctx.arc(cx2 - 11 + look, cy2 - 7, 3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cx2 + 11 + look, cy2 - 7, 3, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#3a2417'; ctx.lineWidth = 3;
    const tilt = hp > 70 ? 0 : hp > 40 ? 2 : 4;
    ctx.beginPath();
    ctx.moveTo(cx2 - 19, cy2 - 17 + tilt); ctx.lineTo(cx2 - 4, cy2 - 17);
    ctx.moveTo(cx2 + 4, cy2 - 17); ctx.lineTo(cx2 + 19, cy2 - 17 + tilt);
    ctx.stroke();
    ctx.strokeStyle = '#5e2030'; ctx.lineWidth = 3;
    ctx.beginPath();
    if (hp > 70) { ctx.arc(cx2, cy2 + 12, 9, 0.2, Math.PI - 0.2); }
    else if (hp > 40) { ctx.moveTo(cx2 - 9, cy2 + 16); ctx.lineTo(cx2 + 9, cy2 + 16); }
    else { ctx.arc(cx2, cy2 + 24, 9, Math.PI + 0.3, TAU - 0.3); }
    ctx.stroke();
  }
  // следы поцелуев — растут с уроном
  const k = Math.min(6, Math.floor((100 - hp) / 16));
  const KP = [[-20, -2], [16, 8], [-8, 20], [20, -14], [-24, 12], [4, -22]];
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#ff4fa8';
  for (let i = 0; i < k; i++) {
    heartPath(ctx, cx2 + KP[i][0], cy2 + KP[i][1], 9);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (hp < 35 && !hurt) { // капля пота
    ctx.fillStyle = '#7fd4ff';
    ctx.beginPath(); ctx.ellipse(cx2 + 30, cy2 - 16, 3, 5, 0, 0, TAU); ctx.fill();
  }
}

function drawSlot(x, y, text, active, enabled) {
  rr(ctx, x, y, 158, 32, 5);
  ctx.fillStyle = '#15141a'; ctx.fill();
  ctx.strokeStyle = active ? '#ff4fa8' : '#3a3744';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = enabled ? (active ? '#ffd1e8' : '#bdb3c9') : '#574f63';
  ctx.font = 'bold 15px "Courier New",monospace';
  ctx.textAlign = 'left';
  ctx.fillText(text, x + 10, y + 21);
}

function drawHUD() {
  ctx.fillStyle = '#221f28'; ctx.fillRect(0, VIEW_H, W, HUD_H);
  ctx.fillStyle = '#33303c'; ctx.fillRect(0, VIEW_H, W, 4);
  ctx.fillStyle = '#ff4fa8'; ctx.fillRect(0, VIEW_H + 4, W, 2);

  const hp = Math.max(0, Math.ceil(player.hp));
  ctx.textAlign = 'left';
  // здоровье
  ctx.fillStyle = '#bdb3c9';
  ctx.font = 'bold 14px "Courier New",monospace';
  ctx.fillText('ЗДОРОВЬЕ', 28, VIEW_H + 30);
  ctx.fillStyle = '#120f16'; ctx.fillRect(28, VIEW_H + 36, 220, 20);
  ctx.fillStyle = `hsl(${Math.round(hp / 100 * 110)},80%,55%)`;
  ctx.fillRect(30, VIEW_H + 38, 216 * hp / 100, 16);
  ctx.strokeStyle = '#3a3744'; ctx.lineWidth = 2;
  ctx.strokeRect(28, VIEW_H + 36, 220, 20);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px "Courier New",monospace';
  ctx.fillText(String(hp), 258, VIEW_H + 54);
  // броня
  ctx.fillStyle = '#9fb2d8';
  ctx.font = 'bold 14px "Courier New",monospace';
  ctx.fillText('БРОНЯ', 28, VIEW_H + 74);
  ctx.fillStyle = '#120f16'; ctx.fillRect(28, VIEW_H + 80, 220, 14);
  ctx.fillStyle = '#6e87c2';
  ctx.fillRect(30, VIEW_H + 82, 216 * player.armor / 100, 10);
  ctx.strokeStyle = '#3a3744'; ctx.strokeRect(28, VIEW_H + 80, 220, 14);
  ctx.fillStyle = '#9fb2d8';
  ctx.font = 'bold 16px "Courier New",monospace';
  ctx.fillText(String(player.armor), 258, VIEW_H + 93);
  // счётчик врагов
  ctx.fillStyle = '#bdb3c9';
  ctx.font = '13px "Courier New",monospace';
  const aliveN = enemies.filter(e => !e.dead).length + Math.max(0, spawnLeft);
  ctx.fillText(`АЛЬТУШЕК РЯДОМ: ${aliveN}`, 28, VIEW_H + 112);

  // оружие (3 слота)
  drawSlot(W / 2 + 60, VIEW_H + 6, '1· СЕРДЕЧКИ ∞', player.weapon === 0, true);
  drawSlot(W / 2 + 60, VIEW_H + 44,
    player.rockets > 0 ? `2· МЕГА ×${player.rockets}` : '2· МЕГА —',
    player.weapon === 1, player.rockets > 0);
  drawSlot(W / 2 + 60, VIEW_H + 82,
    player.cells > 0 ? `3· ЛАЗЕР ×${player.cells}` : '3· ЛАЗЕР —',
    player.weapon === 2, player.cells > 0);

  // счёт и прогресс
  ctx.textAlign = 'right';
  ctx.fillStyle = '#bdb3c9';
  ctx.font = 'bold 14px "Courier New",monospace';
  ctx.fillText('ОЧАРОВАНО', W - 28, VIEW_H + 30);
  ctx.fillStyle = '#ffd1e8';
  ctx.font = 'bold 32px "Courier New",monospace';
  ctx.fillText(String(score), W - 28, VIEW_H + 64);
  ctx.fillStyle = '#bdb3c9';
  ctx.font = '15px "Courier New",monospace';
  ctx.fillText(`УРОВЕНЬ ${level}/${LEVELS.length}`, W - 28, VIEW_H + 90);
  ctx.fillText(`ВОЛНА ${Math.max(wave, 1)}/${LEVELS[level - 1].waves}`, W - 28, VIEW_H + 112);
  ctx.textAlign = 'left';

  drawFace();
}

function drawMenu() {
  ctx.fillStyle = 'rgba(8,4,14,0.9)'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(girlSprites[0][0], 110, 240, 120, 240);
  ctx.drawImage(girlSprites[2][0], 250, 280, 100, 200);
  ctx.drawImage(girlSprites[1][2], 720, 240, 120, 240);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#5e1030';
  ctx.font = 'bold 62px "Courier New",monospace';
  ctx.fillText('ДУМ: АЛЬТУШКИ', W / 2 + 4, 154);
  ctx.fillStyle = '#ff4fa8';
  ctx.fillText('ДУМ: АЛЬТУШКИ', W / 2, 150);
  ctx.fillStyle = '#ff7fc0';
  for (let i = -2; i <= 2; i++) { heartPath(ctx, W / 2 + i * 44, 192, 13); ctx.fill(); }
  ctx.fillStyle = '#e8d9ef';
  ctx.font = '21px "Courier New",monospace';
  ctx.fillText('Они хотят обнять тебя. Навсегда.', W / 2, 246);
  ctx.font = '18px "Courier New",monospace';
  ctx.fillStyle = '#bdb3c9';
  CONTROLS.forEach((l, i) => ctx.fillText(l, W / 2, 318 + i * 30));
  ctx.fillStyle = '#e8d9ef';
  ctx.fillText('Прыгай на платформы, остерегайся воды, хватай лазерган!', W / 2, 318 + CONTROLS.length * 30 + 8);
  if (Math.floor(gt * 1.6) % 2 === 0) {
    ctx.fillStyle = '#ff4fa8';
    ctx.font = 'bold 28px "Courier New",monospace';
    ctx.fillText('КЛИКНИ, ЧТОБЫ НАЧАТЬ', W / 2, 548);
  }
  ctx.fillStyle = '#574f63';
  ctx.font = '13px "Courier New",monospace';
  ctx.fillText('raycasting на чистом JS · без внешних файлов', W / 2, 706);
  ctx.textAlign = 'left';
}

function drawPause() {
  ctx.fillStyle = 'rgba(5,3,10,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#5e1030';
  ctx.font = 'bold 60px "Courier New",monospace';
  ctx.fillText('ПАУЗА', W / 2 + 3, 263);
  ctx.fillStyle = '#ff4fa8';
  ctx.fillText('ПАУЗА', W / 2, 260);
  ctx.fillStyle = '#e8d9ef';
  ctx.font = '22px "Courier New",monospace';
  ctx.fillText('P или клик — продолжить', W / 2, 320);
  ctx.font = '17px "Courier New",monospace';
  ctx.fillStyle = '#bdb3c9';
  CONTROLS.forEach((l, i) => ctx.fillText(l, W / 2, 380 + i * 28));
  ctx.textAlign = 'left';
}

function drawEnd(win) {
  ctx.fillStyle = win ? 'rgba(30,6,24,0.88)' : 'rgba(20,3,10,0.9)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#5e1030';
  ctx.font = 'bold 54px "Courier New",monospace';
  const title = win ? '💖 ПОБЕДА! 💖' : '💋 ТЕБЯ ЗАЦЕЛОВАЛИ 💋';
  ctx.fillText(title, W / 2 + 3, 223);
  ctx.fillStyle = win ? '#ff7fc0' : '#ff4fa8';
  ctx.fillText(title, W / 2, 220);
  ctx.fillStyle = '#e8d9ef';
  ctx.font = '22px "Courier New",monospace';
  ctx.fillText(win ? `Все ${LEVELS.length} уровня зачищены, альтушки очарованы!` : 'Альтушки оказались сильнее…', W / 2, 280);
  ctx.fillStyle = '#ffd1e8';
  ctx.font = 'bold 32px "Courier New",monospace';
  ctx.fillText(`СЧЁТ: ${score}`, W / 2, 350);
  ctx.fillStyle = '#bdb3c9';
  ctx.font = '20px "Courier New",monospace';
  ctx.fillText(`Уровень: ${level}/${LEVELS.length} · Волна: ${Math.max(wave, 1)}/${LEVELS[level - 1].waves}`, W / 2, 392);
  if (Math.floor(gt * 1.6) % 2 === 0) {
    ctx.fillStyle = '#ff4fa8';
    ctx.font = 'bold 26px "Courier New",monospace';
    ctx.fillText('КЛИКНИ, ЧТОБЫ СЫГРАТЬ ЕЩЁ РАЗ', W / 2, 480);
  }
  ctx.textAlign = 'left';
}

// ===================== ввод =====================
const keys = {};
let mouseDown = false;

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyP') {
    if (state === 'play') state = 'pause';
    else if (state === 'pause') state = 'play';
  }
  if (state === 'play') {
    if (e.code === 'Digit1') player.weapon = 0;
    if (e.code === 'Digit2' && player.rockets > 0) player.weapon = 1;
    if (e.code === 'Digit3' && player.cells > 0) player.weapon = 2;
  }
  if ((state === 'menu' || state === 'over' || state === 'win') && e.code === 'Enter') {
    initAudio();
    startGame();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

cv.addEventListener('mousedown', () => {
  initAudio();
  if (state === 'play') {
    mouseDown = true;
    if (document.pointerLockElement !== cv && cv.requestPointerLock) cv.requestPointerLock();
  } else if (state === 'pause') {
    state = 'play';
    if (cv.requestPointerLock) cv.requestPointerLock();
  } else {
    startGame();
    if (cv.requestPointerLock) cv.requestPointerLock();
  }
});
addEventListener('mouseup', () => { mouseDown = false; });
addEventListener('mousemove', e => {
  if (document.pointerLockElement === cv && state === 'play')
    player.ang += e.movementX * 0.0024;
});
// ESC выкидывает из pointer lock — ставим игру на паузу
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== cv && state === 'play') {
    state = 'pause';
    mouseDown = false;
  }
});
addEventListener('blur', () => {
  if (state === 'play') { state = 'pause'; mouseDown = false; }
});

// ===================== цикл =====================
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// для автозапуска (отладка/скриншоты): index.html#play
if (location.hash === '#play') startGame();
</script>
